            opacity: 0; 
            transform: translateY(20px); 
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .fade-card.active, .fade-strip.active {

            transform: translateY(0);

        /* 4枚の強みカードの配置調整（畳背景セクション用） */

        }
        .c1 { top: 15.0%; }
        .c2 { top: 31.0%; }
        .c3 { top: 47.0%; }
        .c4 { top: 63.0%; }

        /* 4本の横長帯の縦位置調整 */
        .fade-strip { left: 13.5%; width: 73%; }
        .s1 { top: 7.6%; }   
        .s2 { top: 22.4%; }  
        .s3 { top: 37.2%; }  
        .s4 { top: 52.0%; }

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;

                0 6px 0 #b32000, /* 濃い赤の立体的な厚み */
                0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.1s ease;
            white-space: nowrap;
            overflow: hidden; 
            font-size: max(12px, 1.5vw); 
        }

        .real-button:active {
            transform: translateY(4px);
            box-shadow: 
                inset 0 2px 3px rgba(255,255,255,0.2), 
                0 2px 0 #b32000, 
                0 4px 10px rgba(0,0,0,0.4);

    <!-- Metaパラメータ取得およびLINE遷移処理スクリプト -->
    <script>
        // LPに到達した時刻を保持（CTAクリック時刻ではなく流入時刻としてLIFFへ渡す）
        const LP_LANDING_TIME = Date.now();

        // 連続タップによるイベント重複と多重遷移を防止
        let isTransitioningToLine = false;

        // URLパラメータを取得する補助関数
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Cookieを取得する補助関数
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // LINE遷移時のイベント計測とパラメータ付与
        function trackLine(label, event) {
            if (event) event.preventDefault();

            if (isTransitioningToLine) return false;
            isTransitioningToLine = true;

            // GA4：CTAタップを line_click として計測
            // label は既存レポートとの互換性維持、line_click_location は今後の正式パラメータ
            gtag('event', 'line_click', {
                label: label,
                line_click_location: label
            });

            // Meta：CTAタップは Contact。Lead はLINE友だち追加完了時にCAPIから送信する
            fbq('track', 'Contact', {
                content_name: label
            });

            // Metaパラメータの取得
            const fbclid = getQueryParam('fbclid');
            const fbc = getCookie('_fbc');
            const fbp = getCookie('_fbp');

            // LIFF URLへ広告照合情報・CTA位置・LP到達時刻を付与
            const LIFF_URL = "https://liff.line.me/2011013586-5JubKIbR";
            const params = new URLSearchParams();

            if (fbclid) params.set('fbclid', fbclid);
            if (fbc) params.set('fbc', fbc);
            if (fbp) params.set('fbp', fbp);
            params.set('cta_location', label);
            params.set('landing_time', String(LP_LANDING_TIME));

            const targetUrl = LIFF_URL + '?' + params.toString();

            // 計測イベントを送信キューへ入れてから同一画面でLIFFへ遷移
            window.setTimeout(function () {
                window.location.assign(targetUrl);
            }, 150);

            return false;
        }
    </script>

<script>
    // 4つの強みカード群の監視
    const sectionCards = document.getElementById('animation-section');
    const cards = document.querySelectorAll('.fade-card');
    const observerCards = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                cards.forEach((card, index) => {
                    setTimeout(() => { card.classList.add('active'); }, index * 200); 
                });
                observerCards.unobserve(sectionCards); 
            }
        });
    }, { threshold: 0.1 });
    if (sectionCards) observerCards.observe(sectionCards);

    // サマリ横長帯の監視
    const sectionStrips = document.getElementById('detail-section');
    const strips = document.querySelectorAll('.fade-strip');
    const observerStrips = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                strips.forEach((strip, index) => {
                    setTimeout(() => { strip.classList.add('active'); }, index * 250); 
                });
                observerStrips.unobserve(sectionStrips); 
            }
        });
    }, { threshold: 0.3 });
    if (sectionStrips) observerStrips.observe(sectionStrips);
</script>
