<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINEへ移動中...</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <p id="status" style="text-align:center;margin-top:50px;font-family:sans-serif;color:#666;">
    LINEへ移動しています...
  </p>

  <script>
    const CONFIG = Object.freeze({
      LIFF_ID: '2011013586-2J5vuC61',
      ENVIRONMENT: 'test',
      GAS_URL: 'https://script.google.com/macros/s/AKfycbw0s0PSru_HXh_yw_1zmDEApf_o5lD_KcHrgmmZugr41wO73kdgKirAABsDsSS2bo40/exec',
      LINE_FRIEND_URL: 'https://lin.ee/oNxrYEJ',
      STORAGE_KEY: 'ninja_meta_tracking_test'
    });

    let hasStarted = false;

    function getTrackingParams() {
      const directParams = new URLSearchParams(window.location.search);
      let stateParams = new URLSearchParams();
      const liffState = directParams.get('liff.state');

      if (liffState) {
        try {
          const decoded = decodeURIComponent(liffState);
          const query = decoded.includes('?') ? decoded.split('?').slice(1).join('?') : decoded;
          stateParams = new URLSearchParams(query);
        } catch (error) {
          console.warn('liff.state parse error:', error);
        }
      }

      function pick(name) {
        return directParams.get(name) || stateParams.get(name) || '';
      }

      return {
        fbclid: pick('fbclid'),
        fbc: pick('fbc'),
        fbp: pick('fbp'),
        ctaLocation: pick('cta_location'),
        landingTime: pick('landing_time')
      };
    }

    function saveTrackingParams(params) {
      const existing = loadTrackingParams();
      const merged = Object.assign({}, existing, params);
      sessionStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(merged));
      return merged;
    }

    function loadTrackingParams() {
      try {
        return JSON.parse(sessionStorage.getItem(CONFIG.STORAGE_KEY) || '{}');
      } catch (error) {
        return {};
      }
    }

    async function sendLiffTouch(userId, tracking) {
      const payload = {
        type: 'liff_touch',
        userId: userId,
        fbclid: tracking.fbclid || '',
        fbc: tracking.fbc || '',
        fbp: tracking.fbp || '',
        ctaLocation: tracking.ctaLocation || '',
        landingTime: tracking.landingTime || '',
        liffTime: Date.now(),
        environment: CONFIG.ENVIRONMENT
      };

      await fetch(CONFIG.GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload),
        keepalive: true
      });
    }

    function goToFriendAdd() {
      window.location.replace(CONFIG.LINE_FRIEND_URL);
    }

    async function main() {
      if (hasStarted) return;
      hasStarted = true;

      try {
        const tracking = saveTrackingParams(getTrackingParams());
        await liff.init({ liffId: CONFIG.LIFF_ID });

        if (!liff.isLoggedIn()) {
          hasStarted = false;
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const profile = await liff.getProfile();
        await sendLiffTouch(profile.userId, tracking);
        sessionStorage.removeItem(CONFIG.STORAGE_KEY);
        goToFriendAdd();
      } catch (error) {
        console.error('LIFF error:', error);
        document.getElementById('status').textContent = 'LINEへ移動します...';
        window.setTimeout(goToFriendAdd, 500);
      }
    }

    main();
  </script>
</body>
</html>
